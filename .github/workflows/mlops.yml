name: MLOps Pipeline Verification

on:
  push:
    branches: [ main, dtree, kridge ]
  pull_request:
    branches: [ main ]

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pipeline Execution Script
      run: |
        if [ -f train.py ]; then
          python train.py
        elif [ -f train2.py ]; then
          python train2.py
        else
          echo "No training script found!"
        fi
